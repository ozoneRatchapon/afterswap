app = "afterswap"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  # The engine loop must keep running between visits.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
