[package]
name = "afterswap-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser build of the AfterSwap exit engine — the whole product runs in your tab"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
afterswap-engine = { path = "../afterswap-engine" }
afterswap-rail = { path = "../afterswap-rail" }
serde_json = { workspace = true }
wasm-bindgen = "=0.2.118"  # must match installed wasm-bindgen CLI
